<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSustentável 2026 - O Equilíbrio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="ui-header">
            <div class="stat">📦 Alimentos: <span id="food-count">0</span></div>
            <div class="stat">🌿 Sustentabilidade: <span id="eco-count">100%</span></div>
            <div class="stat">💰 Recursos: <span id="money-count">5000</span></div>
        </div>
        <div id="game-canvas"></div>
        <div id="controls-footer">
            <p><strong>SETAS:</strong> Mover | <strong>E:</strong> Veículo | <strong>ENTER:</strong> Ação/Falar | <strong>1,2,3:</strong> Diálogos</p>
        </div>
    </div>
    <script src="sketch.js"></script>
</body>
</html>
